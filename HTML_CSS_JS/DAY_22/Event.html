<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegation</title>
</head>
<body>

    <!-- While understanding event delegation we have to understand following pointers -->
    <!--
        1) Event Bubbling : When an event is triggered on an element, it first runs the handlers on it,
           then on its parent, then all the way up on other ancestors.
        2) Event Capturing : It is the opposite of event bubbling.
        3) Event Delegation : It is a technique involving adding a single event listener to a parent element
    -->

    <ul id="itemList"> <!-- Attaching one event listener so that it is applicable to all -->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <script>
        // Adding event listener to the parent element
        document.getElementById('itemList').addEventListener('click', function (event) {
            if (event.target && event.target.nodeName === 'LI') {
                alert('You clicked on ' + event.target.innerText);
            }
        });
    </script>

</body>
</html>
